<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pulse 18+ | Клуб тайных желаний</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg: #0a0a0f;
      --card-bg: #14141e;
      --accent: #ff2a6d;
      --accent-glow: rgba(255, 42, 109, 0.4);
      --text: #f0f0f5;
      --muted: #8e8e9f;
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto; /* Решает проблему скрытых карточек */
      padding-bottom: 120px;
    }

    header {
      padding: 16px;
      text-align: center;
      background: linear-gradient(180deg, rgba(255, 42, 109, 0.15) 0%, rgba(10, 10, 15, 0) 100%);
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-size: 20px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #fff;
      text-shadow: 0 0 12px var(--accent-glow);
    }

    .room-bar {
      margin: 12px 16px;
      padding: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .room-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-accent {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
    }

    .catalog {
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 14px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 4px;
      background: var(--accent);
    }

    .card h3 {
      font-size: 16px;
      color: #fff;
    }

    .card p {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.4;
    }

    .card .meta {
      font-size: 12px;
      color: var(--accent);
      font-weight: 500;
    }

    /* Модальное окно активной игры */
    #activeGameModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(8px);
      z-index: 100;
      padding: 20px;
      flex-direction: column;
      justify-content: space-between;
    }

    .active-game-content {
      margin-top: 40px;
      text-align: center;
    }

    .active-game-content h2 {
      font-size: 22px;
      color: var(--accent);
      margin-bottom: 12px;
    }

    .active-game-content p {
      font-size: 15px;
      line-height: 1.5;
    }

    /* Приватный чат */
    .chat-section {
      margin: 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      height: 260px;
    }

    .chat-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-msg {
      font-size: 13px;
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 10px;
      border-radius: 8px;
      word-break: break-word;
    }

    .chat-msg .sender {
      color: var(--accent);
      font-weight: 600;
    }

    .chat-msg .time {
      font-size: 10px;
      color: var(--muted);
      margin-left: 6px;
    }

    .chat-input-bar {
      display: flex;
      padding: 8px;
      border-top: 1px solid var(--border);
      gap: 8px;
    }

    .chat-input-bar input {
      flex: 1;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>Pulse 18+ Club</h1>
  </header>

  <!-- Инфо о комнате и кнопки -->
  <section class="room-bar">
    <div class="room-header">
      <span>Комната: <strong id="roomIdLabel">...</strong></span>
      <span>В сети: <strong id="playersCount">1</strong> 👤</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-accent" onclick="invitePartner()">🔗 Позвать партнера</button>
      <button class="btn btn-secondary" onclick="addToHomeScreen()">📲 На экран</button>
    </div>
  </section>

  <!-- Каталог всех игр -->
  <main class="catalog" id="gamesCatalog">
    <!-- Игры рендерятся динамически скриптом -->
  </main>

  <!-- Приватный синхронный чат для двоих -->
  <section class="chat-section">
    <div class="chat-header">
      <span>Приватный шепот 18+</span>
      <span style="font-size:11px; color:var(--muted);">Только для этой комнаты</span>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div class="chat-msg"><i>🔒 Чат полностью анонимен. Сообщения не сохраняются в базе.</i></div>
    </div>
    <div class="chat-input-bar">
      <input type="text" id="chatInput" placeholder="Шепнуть партнеру..." onkeydown="if(event.key==='Enter') sendChatMessage()">
      <button class="btn btn-accent" style="padding: 8px 14px;" onclick="sendChatMessage()">➤</button>
    </div>
  </section>

  <!-- Экран активной синхронной игры -->
  <div id="activeGameModal">
    <div class="active-game-content">
      <h2 id="activeGameTitle">Сценарий</h2>
      <p id="activeGameDesc">Ожидание...</p>
      <div id="activeGameAction" style="margin-top:20px; font-weight:bold; color:var(--accent);"></div>
    </div>
    <button class="btn btn-secondary" onclick="closeActiveGame()">Завершить раунд</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand(); // Разворачиваем окно на весь экран мобильного
    }

    const socket = io();
    const user = tg?.initDataUnsafe?.user || {
      id: 'local_' + Math.floor(Math.random() * 1000),
      first_name: 'Игрок'
    };

    // Определение ID комнаты из URL (?room=xxx) или генерация новой
    const urlParams = new URLSearchParams(window.location.search);
    const startAppParam = tg?.initDataUnsafe?.start_param;
    const currentRoom = startAppParam || urlParams.get('room') || 'room_' + Math.floor(1000 + Math.random() * 9000);

    document.getElementById('roomIdLabel').innerText = currentRoom;

    // Вход в сокет-комнату
    socket.emit('join_room', {
      roomId: currentRoom,
      userName: user.first_name,
      userId: user.id
    });

    // Список всех 6 авторских игр каталога
    const ALL_GAMES = [
      {
        id: 'game_freeze',
        title: 'Слепой стоп-кадр: 3 касания на грани',
        category: 'Выдержка & Контроль',
        desc: 'По команде «ЗАМРИ» ведомый застывает на 45 секунд без права шевелиться, пока ведущий ласкает самые чувствительные точки.',
        action: 'Команда: «ЗАМРИ!» — не двигаться следующие 45 секунд.'
      },
      {
        id: 'game_ice_truth',
        title: 'Ледяной допрос: Секрет за глоток',
        category: 'Табу & Откровенность',
        desc: '15 секунд на ответ на потаенный вопрос. При отказе — кубик льда скользит по внутренней стороне бедер без права свести ноги.',
        action: 'Вопрос: «Какая самая смелая мысль приходила тебе в голову за этот месяц?»'
      },
      {
        id: 'game_auction',
        title: 'Аукцион подчинения: 10 минут власти',
        category: 'Доминирование',
        desc: 'Слепые ставки баллами страсти. Победитель аукциона диктует позу, темп и любые команды в спальне на 10 минут.',
        action: 'Победитель забирает статус «Повелитель» на 10 минут!'
      },
      {
        id: 'game_sensory',
        title: 'Температурный капкан: 4 рубежа',
        category: 'Сенсорика & Контраст',
        desc: 'Чередование льда, горячего масла и дыхания с закрытыми глазами. Любой стон громче вздоха добавляет штрафное время.',
        action: 'Рубеж 1: Кубик льда скользит по контуру губ и ключицам.'
      },
      {
        id: 'game_edging',
        title: 'Оргазмический замок (Edging Lock)',
        category: 'На грани',
        desc: 'Стимуляция до пика. По слову «ГРАНЬ» ведущий убирает руки ровно на 45 секунд. Финал разрешен только после 3 кругов.',
        action: 'Круг 1: Стимуляция нарастает. Запрещено финишировать без команды!'
      },
      {
        id: 'game_mirror',
        title: 'Контракт зеркала: Зрительный контакт',
        category: 'Раскрепощение',
        desc: 'Партнеры перед зеркалом. Запрещено отводить взгляд от отражения во время интимных вопросов и тактильных команд.',
        action: 'Смотреть только в глаза через зеркало следующие 60 секунд.'
      }
    ];

    // Рендер каталога
    function renderCatalog() {
      const container = document.getElementById('gamesCatalog');
      container.innerHTML = ALL_GAMES.map(g => `
        <div class="card">
          <div class="meta">${g.category}</div>
          <h3>${g.title}</h3>
          <p>${g.desc}</p>
          <button class="btn btn-accent" style="margin-top:6px;" onclick="triggerGameCard('${g.id}')">
            🔥 Запустить вдвоем
          </button>
        </div>
      `).join('');
    }
    renderCatalog();

    // Запуск игры для обоих смартфонов
    function triggerGameCard(gameId) {
      const game = ALL_GAMES.find(g => g.id === gameId);
      if (!game) return;

      socket.emit('select_game_card', {
        roomId: currentRoom,
        cardData: game,
        chosenBy: user.first_name
      });
    }

    // Слушатель синхронизации игры от сокета
    socket.on('sync_card', (data) => {
      document.getElementById('activeGameTitle').innerText = data.cardData.title;
      document.getElementById('activeGameDesc').innerText = data.cardData.desc;
      document.getElementById('activeGameAction').innerText = `${data.chosenBy} запускает:\n${data.cardData.action}`;
      document.getElementById('activeGameModal').style.display = 'flex';
      
      if (tg?.HapticFeedback) {
        tg.HapticFeedback.notificationOccurred('success');
      }
    });

    function closeActiveGame() {
      document.getElementById('activeGameModal').style.display = 'none';
    }

    // Обновление состава комнаты
    socket.on('room_state', (state) => {
      document.getElementById('playersCount').innerText = state.players.length;
    });

    // Логика чата
    function sendChatMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      socket.emit('send_chat_message', {
        roomId: currentRoom,
        text,
        sender: user.first_name
      });
      input.value = '';
    }

    socket.on('receive_chat_message', (msg) => {
      const box = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = 'chat-msg';
      div.innerHTML = `<span class="sender">${msg.sender}:</span> ${msg.text} <span class="time">${msg.time}</span>`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    });

    // Функция: Пригласить партнера в Telegram
    function invitePartner() {
      const botName = 'pulse18_game_bot';
      // Ссылка формата deep-link: при клике бот откроет Mini App сразу в нужной комнате
      const shareUrl = `https://t.me/${botName}/app?startapp=${currentRoom}`;
      const text = encodeURIComponent('🔞 Жду тебя в приватной комнате клуба Pulse 18+. Заходи:');
      
      if (tg?.openTelegramLink) {
        tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(shareUrl)}&text=${text}`);
      } else {
        window.open(`https://t.me/share/url?url=${encodeURIComponent(shareUrl)}&text=${text}`, '_blank');
      }
    }

    // Функция: Добавить на главный экран
    function addToHomeScreen() {
      if (tg?.checkHomeScreenStatus) {
        tg.checkHomeScreenStatus((status) => {
          if (status === 'missed') {
            tg.addToHomeScreen();
          } else if (status === 'added') {
            alert('Иконка уже добавлена на ваш экран!');
          } else {
            alert('Откройте приложение со смартфона и нажмите на три точки (⋮) в верхнем правом углу Telegram');
          }
        });
      } else {
        alert('Для добавления иконки: откройте Mini App на телефоне, нажмите три точки (⋮) в правом верхнем углу Telegram и выберите «Добавить на главный экран».');
      }
    }
  </script>
</body>
</html>
